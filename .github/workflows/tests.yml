# Test ratchet: a test passing on the base must still pass on the PR head.
# main is red by design while it is built (test units land failing suites), so this is the gate,
# not "all green". .github/guard/bun_ratchet.py is in no unit's write_set; path-guard protects it.
name: tests

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  ratchet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: base checkout
        # HEAD is GitHub's merge commit; its first parent is the main it was merged onto.
        run: git worktree add ../base HEAD^1

      - name: ratchet self-check
        run: python3 .github/guard/bun_ratchet.py --demo

      - name: no passing test breaks
        # a test unit (S-…-T) may redefine tests in the test files it changed
        run: |
          redefined=""
          case "${{ github.head_ref }}" in
            S-*-T) redefined=$(git diff --name-only HEAD^1 HEAD -- '*.test.ts' '*.spec.ts') ;;
          esac
          python3 .github/guard/bun_ratchet.py ../base . $redefined
